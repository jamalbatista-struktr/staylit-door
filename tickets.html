<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stay Lit · Admin</title>
<style>
  :root{--fire:linear-gradient(90deg,#E11D1D,#FF6A00 55%,#FFC400);--bg:#000;--card:#0d0d0d;--line:#2a2a2a;--ink:#F2EDE6;--mute:#9a938a;--ok:#5ad27a;--gold:#FFC400;--bad:#ff8a8a}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Inter,sans-serif}
  .head{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #1c1c1c;background:#000}
  .head b{font-size:15px;letter-spacing:.04em} .head .sub{display:block;font-size:11px;color:var(--mute);font-weight:400;margin-top:2px}
  #menuBtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:42px;height:38px;font-size:20px;line-height:1;cursor:pointer}
  #menu{position:absolute;right:16px;top:60px;background:#111;border:1px solid var(--line);border-radius:14px;min-width:200px;padding:6px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6)}
  #menu.open{display:block} #menu a,#menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:12px 14px;font-size:15px;border-radius:10px;cursor:pointer;text-decoration:none}
  #menu a:hover,#menu button:hover,#menu .on{background:#1c1c1c} #menu .on{color:var(--gold)}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}
  .gate{padding:48px 10px;text-align:center} .gate h1{font-size:22px;margin:0 0 6px} .gate p{color:var(--mute);font-size:14px;margin:0 0 18px}
  input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:16px}
  input[type=password]{max-width:280px;text-align:center;letter-spacing:.2em}
  button.go{border:none;border-radius:999px;padding:13px 20px;font-weight:800;font-size:15px;cursor:pointer;background:var(--fire);color:#1a0f06;margin-top:12px}
  button.go:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;align-items:center} .row>*{flex:1} .row .go{flex:none;margin-top:0;padding:13px 18px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px} .note{color:var(--mute);font-size:13px;margin-top:8px}
  h2{font-size:17px;margin:4px 0 14px} .sec{display:none} .sec.on{display:block}
  .tk{background:var(--card);border:1px solid #1a1a1a;border-radius:14px;padding:12px 14px;margin-top:10px}
  .tk .nm{font-weight:700;font-size:16px} .tk .meta{color:var(--mute);font-size:13px;margin-top:3px;line-height:1.5}
  .pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:999px;text-transform:uppercase;vertical-align:middle;margin-left:8px}
  .p-issued{background:#113a1f;color:var(--ok)} .p-checked_in{background:#3a2e05;color:var(--gold)} .p-void,.p-refunded{background:#222;color:#999}
  .acts{margin-top:10px;display:flex;gap:8px} .mini{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .mini.warn{border-color:#5a2a2a;color:var(--bad)} .mini:disabled{opacity:.4}
  #confirm{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:flex-end;justify-content:center;z-index:9;padding:16px}
  #confirm.show{display:flex} .box{background:#111;border:1px solid var(--line);border-radius:18px;padding:18px;max-width:520px;width:100%}
  .box h3{margin:0 0 6px;font-size:18px} .box p{color:var(--mute);font-size:14px;margin:0 0 12px;line-height:1.5} .box .lst{font-size:14px;margin:0 0 12px;line-height:1.6}
  .box .acts{justify-content:flex-end} .box .go{margin-top:0}
  .ok{color:var(--ok);font-size:14px;margin-top:8px} .fine{font-size:14px;line-height:1.6;margin-top:10px;word-break:break-all}
  label{display:block;color:var(--mute);font-size:12px;margin:12px 0 5px}
  .lkhead{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)} .lkhead b{color:var(--ink)}
</style></head><body>
<div class="head"><div><b>STAY LIT · ADMIN<span class="sub" id="where">Enter the admin code</span></b></div>
  <div><button id="menuBtn" type="button" aria-label="Menu" onclick="toggleMenu()">☰</button>
  <div id="menu">
    <a id="mWho" href="https://scan.staylitpromotions.com/" target="_blank" rel="noopener">Who's in <span style="color:#9a938a;font-size:12px">· door page</span></a>
    <button type="button" id="mSend" onclick="showSec('send')">Send tickets</button>
    <button type="button" id="mManage" onclick="showSec('manage')">Manage tickets</button>
  </div></div>
</div>
<div class="wrap">
  <div id="gate" class="gate">
    <h1>Admin</h1><p>Send tickets, void or restore tickets, see who is in.</p>
    <input id="code" type="password" placeholder="Admin code" autocomplete="off" inputmode="numeric" onkeydown="if(event.key==='Enter')enter()">
    <div><button class="go" id="enter" type="button" onclick="enter()">Enter</button></div>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="secManage" class="sec">
    <h2>Manage tickets</h2>
    <input id="q" type="search" placeholder="Type a name to filter the list" autocomplete="off" oninput="filterList()" onkeydown="if(event.key==='Enter')enterSearch()">
    <div class="lkhead"><b id="lkCount">Loading the list…</b><span id="lkUpd"></span></div>
    <div class="err" id="mErr"></div>
    <div id="results"></div>
  </div>

  <div id="secSend" class="sec">
    <h2>Send tickets</h2>
    <p class="note" style="margin-top:-6px">Issues free tickets and emails them the same way a paid order is delivered.</p>
    <label>Event</label><select id="sEvent" onchange="loadTypes()"></select>
    <label>Ticket type</label><select id="sType"></select>
    <label>How many</label><input id="sQty" type="number" min="1" max="20" value="1" inputmode="numeric">
    <label>Name</label><input id="sName" type="text" autocomplete="off" placeholder="Full name">
    <label>Email</label><input id="sEmail" type="email" autocomplete="off" placeholder="Where the tickets go">
    <label>Phone (optional)</label><input id="sPhone" type="tel" autocomplete="off" placeholder="For the text message">
    <div><button class="go" id="sGo" type="button" onclick="sendTickets()">Send tickets</button></div>
    <div class="err" id="sErr"></div><div id="sOut"></div>
  </div>
</div>

<div id="confirm"><div class="box"><h3 id="cTitle"></h3><p id="cBody"></p><div class="lst" id="cList"></div>
  <input id="reason" type="text" placeholder="Reason (required)" autocomplete="off">
  <div class="err" id="cErr"></div>
  <div class="acts"><button class="mini" type="button" id="cNo" onclick="closeConfirm()">Cancel</button><button class="go" type="button" id="cYes"></button></div>
</div></div>

<script>
const FN="https://vftfzidbhivhyzyphmjf.supabase.co/functions/v1";
const $=id=>document.getElementById(id);
let code=sessionStorage.getItem("slAdminCode")||"",sec="",events=[],lastQ="";
let all=null,lkTimer=null,listTruncated=false;   // the full ticket list, filtered in the page
const hdrs=()=>({"x-admin-code":code,"content-type":"application/json"});
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(t){try{return new Date(t).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});}catch(_){return"";}}

// ---- gate + menu --------------------------------------------------------------
function toggleMenu(){$("menu").classList.toggle("open");}
document.addEventListener("click",function(e){if(!e.target.closest("#menu")&&!e.target.closest("#menuBtn"))$("menu").classList.remove("open");});
async function enter(){
  const c=$("code").value.trim();if(!c){$("gateErr").textContent="Enter the admin code.";return;}
  $("enter").disabled=true;$("gateErr").textContent="";
  // Checking the code with a harmless search: wrong codes are rate limited server side.
  try{
    const r=await fetch(FN+"/admin-tickets?q=zz",{headers:{"x-admin-code":c}});
    if(r.status===401){$("gateErr").textContent="Wrong admin code.";return;}
    if(r.status===429){$("gateErr").textContent="Too many tries. Wait a minute.";return;}
    if(!r.ok){$("gateErr").textContent="Server said "+r.status+". Try again.";return;}
    code=c;sessionStorage.setItem("slAdminCode",code);
    $("gate").style.display="none";showSec("manage");
  }catch(e){$("gateErr").textContent="No connection: "+e.message;}
  finally{$("enter").disabled=false;}
}
function showSec(s){
  if(!code){return;}
  sec=s;$("menu").classList.remove("open");
  $("secManage").classList.toggle("on",s==="manage");$("secSend").classList.toggle("on",s==="send");
  $("mManage").classList.toggle("on",s==="manage");$("mSend").classList.toggle("on",s==="send");
  $("where").textContent=s==="manage"?"Manage tickets":"Send tickets";
  if(s==="send"&&!events.length)loadEvents();
  clearInterval(lkTimer);lkTimer=null;
  if(s==="manage"){if(!all)loadList();lkTimer=setInterval(loadList,60000);$("q").focus();}
}

// ---- manage: full list, filtered as you type; void, restore -------------------------
// Same pattern as Find by name on the door page: the whole list is on screen the
// moment the section opens, letters narrow it, nothing waits on a Search tap.
async function loadList(){
  try{
    const r=await fetch(FN+"/admin-tickets?list=1",{headers:{"x-admin-code":code}});
    if(r.status===401){lock();return;}
    const d=await r.json();
    if(!r.ok){$("mErr").textContent="Could not load the list: "+(d.error||r.status);return;}
    all=(d.tickets||[]).slice().sort(byName);listTruncated=!!d.truncated;
    $("lkUpd").textContent="updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    $("mErr").textContent="";filterList();
  }catch(e){$("mErr").textContent="No connection: "+e.message;}
}
function nameOf(t){return t.guest_name||t.buyer_name||"";}
function byName(a,b){return nameOf(a).localeCompare(nameOf(b),"en",{sensitivity:"base"});}
function filterList(){
  if(!all)return;
  const q=$("q").value.trim().toLowerCase();
  const list=q?all.filter(function(t){return [t.guest_name,t.buyer_name,t.guest_email,t.buyer_email,t.event_name,t.ticket_type,t.status].join(" ").toLowerCase().indexOf(q)>=0;}):all;
  $("lkCount").textContent=(q?list.length+" of ":"")+all.length+" tickets"+(listTruncated?" (list cut off, press Enter to search the rest)":"");
  render(list);
}
// Enter only matters when the list is missing or cut off: then ask the server.
async function enterSearch(){if(all&&!listTruncated)return;await find();}
async function find(){
  const q=$("q").value.trim();if(q.length<2){$("mErr").textContent="Type at least two letters.";return;}
  lastQ=q;$("mErr").textContent="";$("results").innerHTML='<div class="note">Looking…</div>';
  try{
    const r=await fetch(FN+"/admin-tickets?q="+encodeURIComponent(q),{headers:{"x-admin-code":code}});
    if(r.status===401){lock();return;}
    const d=await r.json();
    if(!r.ok){$("mErr").textContent="Could not search: "+(d.error||r.status);$("results").innerHTML="";return;}
    $("lkCount").textContent=(d.tickets||[]).length+" found on the server";
    render(d.tickets||[]);
  }catch(e){$("mErr").textContent="No connection: "+e.message;$("results").innerHTML="";}
}
function lock(){all=null;clearInterval(lkTimer);lkTimer=null;code="";sessionStorage.removeItem("slAdminCode");$("gate").style.display="";$("secManage").classList.remove("on");$("secSend").classList.remove("on");$("gateErr").textContent="Admin code no longer accepted. Enter it again.";}
function render(list){
  const box=$("results");box.innerHTML="";
  if(!list.length){box.innerHTML='<div class="note">'+(all&&all.length?"No tickets match that.":"No tickets yet.")+'</div>';return;}
  list.forEach(function(t){
    const name=t.guest_name||t.buyer_name||"Guest";
    const who=t.holder_ticket_id?("Guest of "+esc(t.holder_name||t.buyer_name||"a table")):(t.live_guests>0?("Table holder · "+t.live_guests+" guest"+(t.live_guests===1?"":"s")+" on it"):"");
    const el=document.createElement("div");el.className="tk";el.dataset.id=t.id;
    el.innerHTML='<div class="nm">'+esc(name)+'<span class="pill p-'+esc(t.status)+'">'+esc(t.status.replace("_"," "))+'</span></div>'
      +'<div class="meta">'+esc(t.event_name)+' · '+esc(t.ticket_type)+(who?'<br>'+who:'')
      +'<br>'+esc(t.buyer_email||t.guest_email||"")+(t.checked_in_at?'<br>Checked in '+esc(fmt(t.checked_in_at)):'')+'</div>'
      +'<div class="acts">'+(t.status==="issued"||t.status==="checked_in"?'<button class="mini warn" type="button">Void</button>':'')
      +(t.status==="void"?'<button class="mini" type="button">Restore</button>':'')+'</div>';
    const b=el.querySelector("button");
    if(b)b.onclick=function(){b.textContent==="Void"?askVoid(t):askRestore(t);};
    box.appendChild(el);
  });
}
let pending=null;
function openConfirm(title,body,listHtml,yesLabel,onYes,needReason){
  $("cTitle").textContent=title;$("cBody").textContent=body;$("cList").innerHTML=listHtml||"";
  $("reason").style.display=needReason?"":"none";$("cErr").textContent="";
  $("cYes").textContent=yesLabel;$("cYes").disabled=false;$("cYes").onclick=onYes;$("confirm").classList.add("show");
}
function closeConfirm(){$("confirm").classList.remove("show");pending=null;}
function askVoid(t){
  pending=t;$("reason").value="";
  openConfirm("Void this ticket?",(t.guest_name||t.buyer_name||"Guest")+" · "+t.event_name+" · "+t.ticket_type+". The QR code stops working at the door and the seat goes back on sale. You can restore it later.","","Void ticket",function(){doVoid(t,{});},true);
}
function askRestore(t){
  pending=t;$("reason").value="restored from admin";
  openConfirm("Restore this ticket?",(t.guest_name||t.buyer_name||"Guest")+" · "+t.event_name+" · "+t.ticket_type+". The QR code works again and the seat is taken again.","","Restore ticket",function(){post(t,{action:"restore"});},false);
}
function doVoid(t,extra){
  const reason=$("reason").value.trim();if(!reason){$("cErr").textContent="Give a reason, one line is fine.";return;}
  post(t,Object.assign({action:"void"},extra));
}
async function post(t,extra){
  const reason=$("reason").value.trim()||"restored from admin";
  $("cYes").disabled=true;$("cErr").textContent="";
  try{
    const r=await fetch(FN+"/admin-tickets",{method:"POST",headers:hdrs(),body:JSON.stringify(Object.assign({ticket_id:t.id,reason:reason},extra))});
    if(r.status===401){closeConfirm();lock();return;}
    const d=await r.json();
    if(!r.ok){$("cErr").textContent="Did not go through: "+(d.error||r.status)+(d.detail?" · "+d.detail:"");$("cYes").disabled=false;return;}
    if(d.status==="has_guests"){
      const names=(d.guests||[]).map(g=>"• "+esc(g.guest_name||"Guest")+" ("+esc(g.status.replace("_"," "))+")").join("<br>");
      openConfirm("This is a table holder","Voiding the holder also voids every guest on the table. "+(d.guests||[]).length+" guest ticket"+((d.guests||[]).length===1?"":"s")+" would stop working too.",names,"Void the whole table",function(){post(t,Object.assign({},extra,{action:"void",cascade_guests:true}));},true);
      $("cYes").disabled=false;return;
    }
    if(d.status==="needs_force"){
      openConfirm("Already checked in","This person scanned in at "+fmt(d.checked_in_at)+". They are inside now. Void anyway?","","Void anyway",function(){post(t,Object.assign({},extra,{action:"void",force:true}));},true);
      $("cYes").disabled=false;return;
    }
    if(d.status==="ok"){
      closeConfirm();
      $("mErr").textContent="";
      const msg=d.to_status==="void"?("Voided"+(d.guests_voided?" with "+d.guests_voided+" guest ticket"+(d.guests_voided===1?"":"s"):"")+"."):"Restored.";
      await loadList();
      const row=document.querySelector('.tk[data-id="'+t.id+'"]');
      if(row){const ok=document.createElement("div");ok.className="ok";ok.textContent=msg;row.appendChild(ok);}
      return;
    }
    $("cErr").textContent={already_void:"Already void.",not_void:"Only a voided ticket can be restored.",not_found:"Ticket not found.",invalid:"This ticket is "+(d.ticket_status||"not usable")+"."}[d.status]||("Server said: "+d.status);
    $("cYes").disabled=false;
  }catch(e){$("cErr").textContent="No connection: "+e.message;$("cYes").disabled=false;}
}

// ---- send tickets (comp) -----------------------------------------------------------
async function loadEvents(){
  $("sErr").textContent="";
  try{
    const r=await fetch(FN+"/list-events?client=stay-lit");const d=await r.json();
    events=d.events||[];const sel=$("sEvent");sel.innerHTML="";
    events.forEach(function(e){const o=document.createElement("option");o.value=e.id;o.textContent=e.name;sel.appendChild(o);});
    if(!events.length){$("sErr").textContent="No live events.";return;}
    loadTypes();
  }catch(e){$("sErr").textContent="Could not load events: "+e.message;}
}
async function loadTypes(){
  const id=$("sEvent").value;const sel=$("sType");sel.innerHTML="<option>Loading…</option>";
  try{
    const r=await fetch(FN+"/get-event?event_id="+encodeURIComponent(id));const d=await r.json();
    sel.innerHTML="";(d.ticket_types||[]).forEach(function(t){const o=document.createElement("option");o.value=t.id;o.textContent=t.name+(t.is_group?" (table, "+t.guests_per_unit+" people)":"");sel.appendChild(o);});
    if(!sel.options.length){sel.innerHTML="<option value=''>No ticket types</option>";}
  }catch(e){sel.innerHTML="<option value=''>Could not load</option>";}
}
async function sendTickets(){
  const name=$("sName").value.trim(),email=$("sEmail").value.trim(),phone=$("sPhone").value.trim(),qty=Number($("sQty").value||1);
  const event_id=$("sEvent").value,ticket_type_id=$("sType").value;
  $("sErr").textContent="";$("sOut").innerHTML="";
  if(!event_id||!ticket_type_id){$("sErr").textContent="Pick an event and a ticket type.";return;}
  if(!name||!email){$("sErr").textContent="Name and email are needed.";return;}
  if(!(qty>=1&&qty<=20)){$("sErr").textContent="How many: 1 to 20.";return;}
  $("sGo").disabled=true;$("sGo").textContent="Sending…";
  try{
    const body={name:name,email:email,lines:[{event_id:event_id,ticket_type_id:ticket_type_id,qty:qty}]};if(phone)body.phone=phone;
    const r=await fetch(FN+"/admin-issue-ticket",{method:"POST",headers:hdrs(),body:JSON.stringify(body)});
    if(r.status===401){lock();return;}
    const d=await r.json();
    if(!r.ok||d.status!=="ok"){$("sErr").textContent="Did not go through: "+(d.error||d.status||r.status);return;}
    const o=(d.orders||[])[0]||{};
    $("sOut").innerHTML='<div class="ok">Sent. '+esc(o.ticket_count||qty)+' ticket'+((o.ticket_count||qty)===1?"":"s")+' for '+esc(o.event_name||"")+' emailed to '+esc(email)+'.</div><div class="fine">Their tickets page: <a style="color:#FFC400" href="'+esc(d.my_tickets_url||"")+'" target="_blank" rel="noopener">'+esc(d.my_tickets_url||"")+'</a></div>';
    $("sName").value="";$("sEmail").value="";$("sPhone").value="";$("sQty").value=1;
  }catch(e){$("sErr").textContent="No connection: "+e.message;}
  finally{$("sGo").disabled=false;$("sGo").textContent="Send tickets";}
}

// ---- boot ---------------------------------------------------------------------------
if(code){$("gate").style.display="none";showSec("manage");}
</script></body></html>
